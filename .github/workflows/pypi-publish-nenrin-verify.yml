name: PyPI publish nenrin-verify (provenance)

# Python 版 nenrin-verify を PyPI に、attestation 付きで出す。npm-publish-nenrin-verify.yml の Python 版。
# 長期の API token は置かん。PyPI の Trusted Publishing (GitHub OIDC) で、PyPI 側に一度だけ設定が要る:
#   pypi.org -> Your account -> Publishing -> Add a new pending publisher (初回、まだ project が無いとき)
#   PyPI project name: nenrin-verify / Owner: ogasurfproject-jpg / Repository: horizon-shield
#   Workflow name: pypi-publish-nenrin-verify.yml / Environment name: pypi
# それまでは publish の段で止まる。止まるだけで何も出ん。
# GitHub 側: Settings -> Environments -> New environment "pypi" を作り、Required reviewers に自分、
# Deployment branches を main だけにしておく。main 以外の branch からは build の段で止まる。
# pypa/gh-action-pypi-publish は既定で PEP 740 の attestation (どの commit のどの workflow が作ったか) を付ける。
#
# 使い方: pyproject.toml の version を上げて commit して push してから、
# Actions -> PyPI publish nenrin-verify (provenance) -> Run workflow -> version に同じ版。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "出す版。workers/hs-ledger/nenrin/sdk-python/pyproject.toml の version と同じでないと止まる"
        required: true

permissions:
  contents: read

concurrency:
  group: pypi-publish-nenrin-verify
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/hs-ledger/nenrin/sdk-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Guard, the version named is the version in the tree and is not on PyPI yet
        env:
          WANT: ${{ github.event.inputs.version }}
        run: |
          HAVE=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          INIT=$(python -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"", open("src/nenrin_verify/__init__.py").read()).group(1))')
          echo "pyproject: $HAVE   __init__: $INIT   asked: $WANT"
          if [ "$HAVE" != "$WANT" ] || [ "$INIT" != "$WANT" ]; then echo "refuse: the tree says $HAVE / $INIT, you asked for $WANT"; exit 1; fi
          if curl -sf "https://pypi.org/pypi/nenrin-verify/$WANT/json" >/dev/null; then echo "refuse: nenrin-verify $WANT is already on PyPI. Bump."; exit 1; fi
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
          ls -l dist
      - name: Test the built wheel, not the tree (frozen parity, live differential, agreement)
        run: |
          python -m venv /tmp/w
          /tmp/w/bin/pip install dist/*.whl pytest
          cd tests && /tmp/w/bin/python -m pytest -q -s -p no:cacheprovider --rootdir=. --import-mode=importlib .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: workers/hs-ledger/nenrin/sdk-python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Publish (Trusted Publishing, GitHub OIDC, with attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
